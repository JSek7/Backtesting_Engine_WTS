[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradsoc-market-making-starter"
version = "0.1.0"
description = "TradSoc public-data market-making practice backtester"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "matplotlib>=3.7,<4", "plotly>=6,<8"]

[project.scripts]
tradsoc-backtest = "run_backtest:main"

[tool.setuptools]
py-modules = ["run_backtest"]

[tool.setuptools.packages.find]
include = ["bots*", "models*", "engine*", "competition*", "backtesting*", "reporting*", "storage*"]
exclude = ["tests*"]
